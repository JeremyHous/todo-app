<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Todo</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Pink mode</button>
    </header>

    <form id="todo-form" class="todo-form">
      <input
        id="todo-input"
        type="text"
        placeholder="What needs to be done?"
        autocomplete="off"
        aria-label="New task"
        required
      >
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state">No tasks yet. Add one above.</p>

    <footer id="todo-footer" class="todo-footer">
      <span id="todo-count" aria-live="polite"></span>
      <button id="clear-completed" class="clear-completed" type="button">Clear completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
